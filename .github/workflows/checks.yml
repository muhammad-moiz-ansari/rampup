name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rampup
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rampup_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rampup -d rampup_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://rampup:ci-only-password@localhost:5432/rampup_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check . && ruff format --check .
        working-directory: backend
      - run: python -m pytest tests -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run typecheck && npm run build
        working-directory: frontend
      - run: docker build -t rampup:check .
