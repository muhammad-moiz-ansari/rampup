services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rampup
      POSTGRES_USER: rampup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rampup -d rampup"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rampup:${POSTGRES_PASSWORD}@db:5432/rampup
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
